<!doctype html>
<html lang="zh" data-theme="__THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Editor</title>
  <link rel="stylesheet" href="/assets/shared/themes.css">
  <style>
    html, body { margin: 0; background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
    /* Fallback until the trusted viewport synchronizer sets an explicit pixel height. */
    html { height: 100vh; height: 100dvh; overflow: hidden; }
    body { height: 100%; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    #editor { flex: 1; min-height: 0; overflow: hidden; }
    #editor .cm-editor { height: 100%; }
    #editor .cm-editor.cm-focused { outline: none; }

    /* 键盘上方的符号栏：手机键盘打这些符号要切好几层 */
    .bar {
      flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
      padding: 4px 6px; background: var(--code-bg); border-top: 1px solid var(--border);
    }
    .bar[hidden] { display: none; }
    .bar::-webkit-scrollbar { display: none; }
    .bar button {
      flex: none; min-width: 40px; height: 36px; padding: 0 10px;
      border: 0; border-radius: 6px; background: transparent; color: var(--fg);
      font: 15px var(--font-mono);
    }
    .bar button:active { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    .bar button.word { font: 13px var(--font-sans); color: var(--accent); }
    .bar .sep { flex: none; width: 1px; margin: 6px 4px; background: var(--border); }
    .fallback { padding: 16px; color: var(--muted); font: 13px var(--font-sans); }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div class="bar" id="bar">
    <button class="word" data-act="undo" aria-label="撤销">撤销</button>
    <button class="word" data-act="redo" aria-label="重做">重做</button>
    <button class="word" data-act="search" aria-label="查找">查找</button>
    <span class="sep"></span>
    <button data-act="indent" aria-label="缩进">⇥</button>
    <button data-pair="()">( )</button>
    <button data-pair="{}">{ }</button>
    <button data-pair="[]">[ ]</button>
    <button data-pair='""'>" "</button>
    <button data-pair="''">' '</button>
    <button data-text=";">;</button>
    <button data-text=":">:</button>
    <button data-text="=">=</button>
    <button data-text=".">.</button>
    <button data-text=",">,</button>
    <button data-text="<">&lt;</button>
    <button data-text=">">&gt;</button>
    <button data-text="/">/</button>
    <button data-text="#">#</button>
    <button data-text="_">_</button>
  </div>

  <!-- Kotlin 替换成 JSON：{"text": "...", "lang": "kotlin", "wrap": false} -->
  <script type="application/json" id="payload">/*PAYLOAD*/</script>
  <script src="/assets/edit/cm6.bundle.js"></script>
  <script>
    window.setTheme = function (t) {
      if (['auto', 'paper', 'ink', 'terminal'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
    };

    // A retained application-context WebView can load before native measurement. Its CSS
    // percentage/viewport heights may remain zero even when innerHeight becomes positive.
    // Follow viewport events in pixels, including every keyboard resize animation step.
    (function () {
      var pending = false;
      var lastHeight = 0;
      function syncViewport() {
        pending = false;
        var height = window.innerHeight;
        if (height <= 0) return;
        if (height !== lastHeight) {
          lastHeight = height;
          document.documentElement.style.height = height + 'px';
          // Chromium may pan the outer page to the caret while the IME opens. Only the
          // CodeMirror scroller should scroll; preserve its independent scroll position.
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
      }
      function scheduleViewport() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(syncViewport);
      }
      window.addEventListener('resize', scheduleViewport);
      window.addEventListener('load', scheduleViewport);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleViewport);
      scheduleViewport();
    })();

    (function () {
      window.editorApi = null;
      var p;
      var host = document.getElementById('editor');

      if (!window.YHEditor) {
        // 打包文件缺失：给出明确提示，绝不能让用户在一个看似正常的空编辑器里"编辑"然后保存掉原文
        host.innerHTML = '<p class="fallback" role="alert">编辑器组件未加载（assets/edit/cm6.bundle.js 缺失），无法编辑。</p>';
        document.getElementById('bar').hidden = true;
        window.editorApi = null;
        return;
      }

      var api;
      try {
        p = JSON.parse(document.getElementById('payload').textContent);
        api = window.YHEditor.create(host, { text: p.text, lang: p.lang, wrap: p.wrap });
      } catch (error) {
        var message = document.createElement('p');
        message.className = 'fallback';
        message.setAttribute('role', 'alert');
        message.textContent = '编辑器组件初始化失败，无法编辑。' + (error instanceof RangeError ? error.message : '');
        host.textContent = '';
        host.appendChild(message);
        document.getElementById('bar').hidden = true;
        return;
      }

      // Kotlin 通过 evaluateJavascript 调用这些方法；返回值由 WebView 序列化成 JSON 交回原生
      window.editorApi = api;
      window.setWrap = function (on) { api.setWrap(!!on); };

      // 符号栏：pointerdown 时阻止默认行为，按钮不抢焦点，键盘不会收起
      document.getElementById('bar').addEventListener('pointerdown', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        e.preventDefault();
        var act = b.getAttribute('data-act');
        var pair = b.getAttribute('data-pair');
        var text = b.getAttribute('data-text');
        if (act && typeof api[act] === 'function') api[act]();
        else if (pair) api.insert(pair, 1);
        else if (text) api.insert(text, 0);
      });
    })();
  </script>
</body>
</html>
