<!doctype html>
<html lang="zh" data-theme="__THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter</title>
  <link rel="stylesheet" href="/assets/shared/themes.css">
  <style>
    /* 排版变量的默认值；实际值由 #reading 里的 :root 规则覆盖（来自 ReadingPrefs.toCss） */
    :where(:root) { --read-scale: 1; --read-line: 1.9; --read-margin: 20px; --read-font: var(--font-body); }
    body {
      margin: 0 auto; max-width: 720px;
      padding: 24px var(--read-margin) 48px;
      color: var(--fg); background: var(--bg);
      font-family: var(--read-font);
      font-size: calc(18px * var(--read-scale));
      line-height: var(--read-line);
      -webkit-text-size-adjust: 100%;
      word-wrap: break-word; text-align: justify;
    }
    h1 { font-size: 1.25em; line-height: 1.4; color: var(--heading); margin: .4em 0 1.4em; text-align: left; }
    p { margin: 0 0 .9em; text-indent: 2em; }
    .end { margin-top: 3em; text-align: center; color: var(--muted); font-size: .8em; text-indent: 0; }
    [data-theme="terminal"] body { font-size: calc(15px * var(--read-scale)); text-align: left; }
  </style>
  <style id="reading"></style>
</head>
<body>
  <h1 id="title"></h1>
  <main id="content"></main>

  <!-- Kotlin 替换成 JSON：{"title": "...", "text": "...", "position": "3 / 120", "reading": ":root{...}"} -->
  <script type="application/json" id="payload">/*PAYLOAD*/</script>
  <script>
    window.setTheme = function (t) {
      if (['auto', 'paper', 'ink', 'terminal'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
    };
    // 字号、行距等实时调整：只替换一条 CSS 变量规则，不重新渲染正文
    window.setReading = function (css) {
      document.getElementById('reading').textContent = css;
    };
    // v13：液态玻璃。原生控件（底部胶囊、拖动中的滑杆）在这些位置，页面把它们下面的内容模糊掉（见 Glass.kt）
    window.yhGlass = function (rects) {
      var host = document.getElementById('yh-glass');
      if (!host) {
        host = document.createElement('div');
        host.id = 'yh-glass';
        host.setAttribute('aria-hidden', 'true');
        host.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2147483647';
        document.documentElement.appendChild(host);
      }
      rects = Array.isArray(rects) ? rects.slice(0, 4) : [];
      while (host.children.length < rects.length) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;pointer-events:none;opacity:0;transition:opacity .16s;' +
          'background:color-mix(in srgb, var(--bg) 14%, transparent);' +
          '-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)';
        host.appendChild(d);
      }
      for (var i = 0; i < host.children.length; i++) {
        var el = host.children[i], r = rects[i];
        if (!r) { el.style.opacity = '0'; continue; }
        el.style.left = (+r.x || 0) + 'px'; el.style.top = (+r.y || 0) + 'px';
        el.style.width = Math.max(0, +r.w || 0) + 'px'; el.style.height = Math.max(0, +r.h || 0) + 'px';
        el.style.borderRadius = Math.max(0, +r.r || 0) + 'px';
        el.style.opacity = '1';
      }
    };
    (function () {
      var p = JSON.parse(document.getElementById('payload').textContent);
      if (p.reading) window.setReading(p.reading);
      document.getElementById('title').textContent = p.title;
      document.title = p.title;
      var out = document.getElementById('content');
      var frag = document.createDocumentFragment();
      p.text.split(/\r?\n/).forEach(function (line) {
        var s = line.replace(/^[\s　]+|[\s　]+$/g, '');
        if (!s) return;
        var el = document.createElement('p');
        el.textContent = s;
        frag.appendChild(el);
      });
      out.appendChild(frag);
      var end = document.createElement('p');
      end.className = 'end';
      end.textContent = p.position;
      out.appendChild(end);
    })();
  </script>
</body>
</html>
