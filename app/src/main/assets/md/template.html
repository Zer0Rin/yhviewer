<!doctype html>
<html lang="zh" data-theme="__THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown</title>
  <link rel="stylesheet" href="/assets/shared/themes.css">
  <style>
/* ================= 通用排版（所有主题共用，只读变量） ================= */
    /* v13：字号、行距、页边距、字体可调（Aa）。默认值等于原来的排版；实际值由 #reading 覆盖（ReadingPrefs.toCss） */
    :where(:root) { --read-scale: 1; --read-line: var(--line); --read-margin: 20px; --read-font: var(--font-body); }
    body {
      margin: 0 auto; max-width: var(--width); padding: 16px var(--read-margin) 48px;
      color: var(--fg);
      font-size: calc(var(--size) * var(--read-scale)); line-height: var(--read-line); font-family: var(--read-font);
      word-wrap: break-word; -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3, h4, h5, h6 { color: var(--heading); line-height: 1.3; margin: 1.6em 0 .6em; font-weight: 650; }
    h1 { font-size: 1.65em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    h2 { font-size: 1.3em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
    h3 { font-size: 1.12em; }
    body > :first-child, main > :first-child { margin-top: 0; }
    strong { color: var(--strong); font-weight: 700; }
    a { color: var(--link); text-decoration: none; }
    a:active { text-decoration: underline; }
    li::marker { color: var(--marker); }
    code { font-family: var(--font-mono); font-size: .86em; color: var(--inline-code);
           background: var(--code-bg); padding: .12em .36em; border-radius: 4px; }
    pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px;
          overflow-x: auto; line-height: 1.5; }
    pre code { color: var(--code-fg); background: none; padding: 0; font-size: .84em; }
    blockquote { margin: 1em 0; padding: 0 1em; color: var(--quote); border-left: 3px solid var(--accent); }
    table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1em 0; }
    th, td { border: 1px solid var(--border); padding: 6px 10px; }
    th { background: var(--code-bg); color: var(--heading); }
    img { max-width: 100%; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
    .fallback-note { color: var(--muted); font-size: .9em; }

    /* ================= Terminal 结构样式：把 Markdown 标记"显示出来" ================= */
    [data-theme="terminal"] h1, [data-theme="terminal"] h2, [data-theme="terminal"] h3,
    [data-theme="terminal"] h4, [data-theme="terminal"] h5, [data-theme="terminal"] h6 {
      font-size: 1em; font-weight: 700; border: 0; padding: 0; margin: 1.5em 0 .9em;
    }
    /* 不显示 # 号，层级靠字号区分（等宽字体下差距保持克制） */
    [data-theme="terminal"] h1 { font-size: 1.3em; }
    [data-theme="terminal"] h2 { font-size: 1.15em; }
    [data-theme="terminal"] ul { list-style: none; padding-left: 1.4em; }
    [data-theme="terminal"] ul > li { position: relative; }
    [data-theme="terminal"] ul > li::before { content: "-"; position: absolute; left: -1.2em; color: var(--marker); }
    [data-theme="terminal"] ol { padding-left: 2em; }
    [data-theme="terminal"] code { background: none; padding: 0; font-size: 1em; border-radius: 0; }
    [data-theme="terminal"] pre { border-radius: 0; border-left: 2px solid var(--border); }
    [data-theme="terminal"] pre code { font-size: 1em; }
    [data-theme="terminal"] a { text-decoration: underline; text-underline-offset: 3px; }
    [data-theme="terminal"] blockquote { border-left: 0; padding-left: 1.4em; position: relative; }
    [data-theme="terminal"] blockquote::before { content: ">"; position: absolute; left: 0; color: var(--marker); }
    [data-theme="terminal"] th { background: none; }
    [data-theme="terminal"] hr { border-top-style: dashed; }
      /* v10：脚注 */
    .footnotes-sep { border: 0; border-top: 1px solid var(--border); margin: 2em 0 1em; }
    .footnotes { font-size: .88em; color: var(--muted); }
    .footnote-ref a, .footnote-backref { text-decoration: none; }
</style>
  <style id="reading">/*MD_READING*/</style>
</head>
<body>
  <main id="content"></main>

  <!-- Kotlin 会把这里替换成 JSON 字符串（所有 "<" 已转成 \u003c，无法提前闭合 script 标签） -->
  <script type="application/json" id="md-src">/*MD_JSON*/</script>

  <script src="/assets/md/markdown-it.min.js"></script>
  <script src="/assets/md/highlight.min.js"></script>
  <!-- v10：脚注语法（[^1]）。文件缺失时跳过，不影响其他渲染 -->
  <script src="/assets/md/markdown-it-footnote.min.js"></script>
  <script>
    // 供 Kotlin 通过 evaluateJavascript 实时切换主题（白名单，不接受任意字符串）
    // v13：字号、行距等实时调整：只替换一条 CSS 变量规则
    window.setReading = function (css) {
      document.getElementById('reading').textContent = String(css);
    };
    window.setTheme = function (t) {
      if (['auto', 'paper', 'ink', 'terminal'].indexOf(t) >= 0) {
        document.documentElement.setAttribute('data-theme', t);
      }
    };

    // v13：液态玻璃。原生控件（底部胶囊、拖动中的滑杆）在这些位置，页面把它们下面的内容模糊掉（见 Glass.kt）
    window.yhGlass = function (rects) {
      var host = document.getElementById('yh-glass');
      if (!host) {
        host = document.createElement('div');
        host.id = 'yh-glass';
        host.setAttribute('aria-hidden', 'true');
        host.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2147483647';
        document.documentElement.appendChild(host);
      }
      rects = Array.isArray(rects) ? rects.slice(0, 4) : [];
      while (host.children.length < rects.length) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;pointer-events:none;opacity:0;transition:opacity 160ms cubic-bezier(0.23, 1, 0.32, 1);' +
          'background:color-mix(in srgb, var(--bg) 14%, transparent);' +
          '-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)';
        host.appendChild(d);
      }
      for (var i = 0; i < host.children.length; i++) {
        var el = host.children[i], r = rects[i];
        // v17：和原生控件一致：出现 160ms，消失 120ms（Motion.ENTER_MS / EXIT_MS）
        if (!r) { el.style.transitionDuration = '120ms'; el.style.opacity = '0'; continue; }
        el.style.transitionDuration = '160ms';
        el.style.left = (+r.x || 0) + 'px'; el.style.top = (+r.y || 0) + 'px';
        el.style.width = Math.max(0, +r.w || 0) + 'px'; el.style.height = Math.max(0, +r.h || 0) + 'px';
        el.style.borderRadius = Math.max(0, +r.r || 0) + 'px';
        el.style.opacity = '1';
      }
    };

    (function () {
      const src = JSON.parse(document.getElementById('md-src').textContent);
      const out = document.getElementById('content');

      if (!window.markdownit) {
        const note = document.createElement('p');
        note.className = 'fallback-note';
        note.textContent = '⚠ markdown-it 未加载，以纯文本显示';
        const pre = document.createElement('pre');
        pre.textContent = src;
        out.append(note, pre);
        return;
      }

      const md = window.markdownit({
        html: false,
        linkify: true,
        typographer: false,
        highlight(code, lang) {
          if (window.hljs && lang && hljs.getLanguage(lang)) {
            try {
              return '<pre class="hljs"><code>' +
                hljs.highlight(code, { language: lang, ignoreIllegals: true }).value +
                '</code></pre>';
            } catch (_) { /* 落到默认渲染 */ }
          }
          return '';
        },
      });

      if (window.markdownitFootnote) md.use(window.markdownitFootnote);
      out.innerHTML = md.render(src);

      const h = out.querySelector('h1, h2');
      if (h) document.title = h.textContent;
    })();
  </script>
</body>
</html>
