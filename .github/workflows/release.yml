name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25 # 和 ci.yml 保持一致

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install compile SDK and verification tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :app:testStrictDebugUnitTest :app:testStandardDebugUnitTest --no-configuration-cache --stacktrace

      # Manual runs produce signed candidates only; tag runs must match versionName.
      - name: Resolve release version
        run: |
          set -euo pipefail
          NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected one semantic versionName"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$NAME" ]] || { echo "::error::Tag and versionName differ"; exit 1; }
          elif [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::Unsupported release event"; exit 1
          fi
          echo "RELEASE_VERSION=v$NAME" >> "$GITHUB_ENV"

      # 签名密钥只存在 GitHub Secrets 里，运行时解码到临时目录，任务结束即销毁
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name; see RELEASE.md"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStrictRelease :app:assembleStandardRelease --no-configuration-cache --stacktrace

      # 发布前校验：签名有效；Strict 无网络权限，Standard 必须有网络权限
      # （依赖库可能通过 Manifest 合并偷偷带进 INTERNET，所以检查最终产物，而不是源码里的 Manifest）
      - name: Verify APK
        run: |
          set -euo pipefail
          for flavor in strict standard; do
            APK="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            scripts/verify-release.sh "$APK" "$RELEASE_VERSION" io.github.zer0rin.yhviewer "$flavor"
            cp "$APK" "yhviewer-$RELEASE_VERSION-$flavor.apk"
          done
          sha256sum "yhviewer-$RELEASE_VERSION-strict.apk" "yhviewer-$RELEASE_VERSION-standard.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Debug tests cannot detect optimizer-only startup failures.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke optimized release on API 34
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            python3 scripts/smoke-release.py app/build/outputs/apk/strict/release/app-strict-release.apk
            python3 scripts/smoke-release.py app/build/outputs/apk/standard/release/app-standard-release.apk

      - name: Upload signed candidate and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-candidate-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            yhviewer-*.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes_path="docs/releases/$GITHUB_REF_NAME.md"
          release_notes_args=(--generate-notes)
          if [[ -f "$release_notes_path" ]]; then
            release_notes_args=(--notes-file "$release_notes_path")
          fi
          gh release create "$GITHUB_REF_NAME" "yhviewer-$RELEASE_VERSION-strict.apk" "yhviewer-$RELEASE_VERSION-standard.apk" SHA256SUMS.txt \
            --title "YHViewer $GITHUB_REF_NAME" \
            "${release_notes_args[@]}" \
            --verify-tag

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
